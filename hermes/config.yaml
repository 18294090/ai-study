hermes:
  runtime:
    host: "127.0.0.1"
    port: 8080
    max_iterations: 90
    timeout: 300

  memory:
    type: "sqlite"
    path: "~/.hermes/memory.db"

  skills:
    exam_skill:
      enabled: true
      confidence_threshold: 0.6
      tools:
        - parse_pdf_tool
        - extract_questions_tool
        - validate_question_tool
        - refine_question_tool

  providers:
    default: "openrouter"
    openrouter:
      api_key: "${OPENROUTER_API_KEY}"
      model: "deepseek/deepseek-chat-v3"
