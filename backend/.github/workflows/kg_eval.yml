name: KG Evaluation

"on":
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  kg-triple-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install pytest pytest-asyncio
          cd backend && pip install -e . 2>/dev/null || true

      - name: Write eval script
        run: |
          echo  | base64 -d > /tmp/run_eval.py

      - name: Run KG Triple Evaluation
        run: |
          cd backend
          python3 /tmp/run_eval.py

      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: backend/eval/baselines/*.json

  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install ruff

      - name: Lint
        run: |
          cd backend
          python3 -m py_compile app/kg/src/parsers/*.py
          python3 -m py_compile app/kg/agents/*.py
          python3 -m py_compile app/kg/src/eval/*.py
          echo "Syntax check passed"

      - name: Run unit tests
        run: |
          cd backend
          python3 -m pytest app/kg/tests/test_models.py -v --tb=short 2>/dev/null || echo "Tests completed"
