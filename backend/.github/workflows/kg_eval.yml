name: KG Evaluation

"on":
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  kg-triple-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install pytest pytest-asyncio
          cd backend && pip install -e . || echo "WARNING: Backend installation failed, continuing anyway..."

      - name: Write eval script
        run: |
          printf 'import sys\nsys.path.insert(0, "app/kg")\nfrom src.eval.runner import run_eval\nfrom src.eval.metrics import triple_prf, aggregate_metrics\nimport json\n\ndef extractor(text):\n    return []\n\nresult = run_eval(\n    extractor=extractor,\n    dataset_path="data/eval/kg_triples_sample.json"\n)\nmetrics = result["metrics"]\nprint("Precision", metrics["precision"])\nprint("Recall", metrics["recall"])\nprint("F1", metrics["f1"])\n\nf1 = metrics["f1"]\nthreshold = 0.80\nif f1 >= threshold:\n    print("PASS: F=", f1, " >= ", threshold)\n    sys.exit(0)\nelse:\n    print("FAIL: F=", f1, " < ", threshold)\n    sys.exit(1)\n' > /tmp/run_eval.py

      - name: Run KG Triple Evaluation
        run: |
          cd backend
          python3 /tmp/run_eval.py

      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: backend/eval/baselines/*.json

  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pytest pytest-asyncio

      - name: Lint
        run: |
          cd backend
          python3 -m py_compile app/kg/src/parsers/*.py
          python3 -m py_compile app/kg/agents/*.py
          python3 -m py_compile app/kg/src/eval/*.py
          echo "Syntax check passed"

      - name: Run unit tests
        run: |
          cd backend
          python3 -m pytest app/kg/tests/test_models.py -v --tb=short
