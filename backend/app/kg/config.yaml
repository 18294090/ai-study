llm:
  provider: "openai"
  model: "gpt-4o"
  api_key_env: "OPENAI_API_KEY"
  base_url: "https://api.openai.com/v1"

parsing:
  default_parsers: ["mineru", "marker", "docling"]
  device: "cuda"

storage:
  neo4j:
    uri_env: "NEO4J_URI"
    user_env: "NEO4J_USER"
    password_env: "NEO4J_PASSWORD"
    database: "neo4j"
  qdrant:
    url_env: "QDRANT_URL"
    collection: "textbook_chunks"

eval:
  default_threshold: 0.7
  min_f1: 0.5

graphrag:
  embedding:
    provider: "bge-m3"
    model: "BAAI/bge-m3"
    api_key_env: "OPENAI_API_KEY"
    base_url: "http://localhost:8000/v1"
  reranker:
    provider: "cohere"
    model: "rerank-v3"
    api_key_env: "COHERE_API_KEY"
  generator:
    default_model: "gpt-4o"
    reasoning_model: "o3"
    api_key_env: "OPENAI_API_KEY"
  retrieval:
    vector_top_k: 30
    rerank_top_k: 10